name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.2"
          cache: npm
      - run: npm ci
      - name: Build extension and generate types
        run: npm run build -- -e dist -o dist --exit-on-error
      - name: Type check, lint, and regression tests
        run: npm run check
